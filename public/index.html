<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BricoLoop</title>
  <style>
    :root { --bg: #f6f5f1; --card: #fff; --text: #1f2421; --muted: #6b716d; --line: #e2e0d8; --accent: #2f6f4f; --accent-soft: #e3efe8; --err: #a12c2c; --err-soft: #fbe9e9; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--accent); color: #fff; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; font-size: 1.4rem; }
    header label { display: flex; gap: 8px; align-items: center; }
    select, input, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); }
    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 24px; grid-template-columns: 1fr; }
    @media (min-width: 760px) { main { grid-template-columns: 1fr 1fr; } }
    h2 { margin: 0 0 12px; font-size: 1.15rem; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    #catalogue { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .tool { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; background: var(--card); cursor: pointer; }
    .tool:hover, .tool.selected { border-color: var(--accent); background: var(--accent-soft); }
    .tool-name { font-weight: 600; }
    .tool-category { color: var(--muted); font-size: .9rem; grid-row: 2; }
    .badge { font-size: .8rem; padding: 2px 8px; border-radius: 999px; align-self: center; grid-row: 1 / 3; grid-column: 2; background: #eee; }
    .badge.available { background: var(--accent-soft); color: var(--accent); }
    .badge.lent { background: #fff3d6; color: #7a5600; }
    .badge.unavailable { background: #eee; color: var(--muted); }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 16px 0; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    form h3 { margin: 0 0 8px; font-size: 1rem; }
    .dates { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    button[type="submit"] { background: var(--accent); color: #fff; border: none; cursor: pointer; }
    .message { grid-column: 1 / -1; padding: 12px 16px; border-radius: 8px; margin: 0; }
    .message.error { background: var(--err-soft); color: var(--err); border: 1px solid var(--err); }
    .message.success { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
    .empty, .hint { color: var(--muted); }
    .mine { grid-column: 1 / -1; }
    #mine { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    #mine li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
    .badge.pending { background: #e8eefb; color: #2b4f9c; }
    .badge.accepted { background: var(--accent-soft); color: var(--accent); }
    .badge.refused { background: var(--err-soft); color: var(--err); }
    .badge.returned { background: #eee; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>BricoLoop</h1>
    <label>Je suis
      <select id="profile" aria-label="Choisir mon profil">
        <option value="">— Choisis ton profil —</option>
      </select>
    </label>
  </header>
  <main>
    <p id="message" class="message" role="alert" hidden></p>
    <section class="panel">
      <h2>Catalogue</h2>
      <ul id="catalogue"></ul>
    </section>
    <section class="panel">
      <p class="hint" id="detail-hint">Clique sur un outil pour voir sa fiche.</p>
      <div id="detail" hidden></div>
    </section>
    <section class="panel mine">
      <h2>Mes demandes</h2>
      <ul id="mine"></ul>
    </section>
  </main>
  <script type="module" src="/main.js"></script>
</body>
</html>
